<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dziękujemy | Uniforno</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://uniforno.pl/dziekujemy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1916; --paper: #f5f2eb; --warm: #e8e2d5;
    --accent: #c8a96e; --muted: #7a7670; --border: rgba(26,25,22,0.12);
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'DM Sans', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-weight: 300; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

  nav { display: flex; align-items: center; justify-content: center; padding: 28px 48px; border-bottom: 0.5px solid var(--border); }
  .logo { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: 0.06em; color: var(--ink); text-decoration: none; }
  .logo span { color: var(--accent); }

  .ty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 80px 24px 100px; }
  .ty-icon { color: var(--accent); margin-bottom: 30px; line-height: 0; }
  .ty-icon svg { width: 56px; height: 56px; }
  .ty-eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.18em; color: var(--accent); text-transform: uppercase; margin-bottom: 20px; }
  h1 { font-family: var(--font-display); font-size: clamp(40px, 5.5vw, 64px); font-weight: 500; line-height: 1.05; letter-spacing: -0.01em; color: var(--ink); margin-bottom: 22px; text-wrap: balance; }
  .ty-text { font-size: 16px; font-weight: 300; line-height: 1.75; color: var(--muted); max-width: 480px; margin-bottom: 40px; }
  .ty-btn { font-family: var(--font-body); font-size: 13px; font-weight: 500; letter-spacing: 0.08em; background: var(--ink); color: var(--paper); padding: 15px 34px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: background 0.2s, color 0.2s; }
  .ty-btn:hover { background: var(--accent); color: var(--ink); }
  .ty-btn svg { width: 16px; height: 16px; }

  footer { padding: 26px 48px; border-top: 0.5px solid var(--border); text-align: center; }
  .footer-copy { font-size: 12px; font-weight: 300; color: var(--muted); }

  @media (max-width: 900px) {
    nav { padding: 22px 24px; }
    .ty { padding: 60px 24px 80px; }
    footer { padding: 22px 24px; }
  }
</style>
</head>
<body>

<nav>
  <a class="logo" href="/">Uniforn<span>o</span></a>
</nav>

<main class="ty">
  <div class="ty-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>
  </div>
  <div class="ty-eyebrow">Formularz wysłany</div>
  <h1>Dziękujemy za wiadomość</h1>
  <p class="ty-text">Twoje zapytanie do nas dotarło. Odezwiemy się z odpowiedzią najszybciej jak to możliwe, zwykle w ciągu 24 godzin.</p>
  <a class="ty-btn" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    Wróć na stronę główną
  </a>
</main>

<footer>
  <div class="footer-copy">&copy; 2026 Uniforno. Polska produkcja, polska jakość.</div>
</footer>

</body>
</html>
